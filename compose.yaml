services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bda
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bda_pgdata:/var/lib/postgresql/data
volumes:
  bda_pgdata:
